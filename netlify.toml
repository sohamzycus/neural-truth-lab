# SamaBPE — single source of truth for Netlify (works regardless of UI base-dir setting)
[build]
  base = "session2/web"
  command = "test -f dist/index.html && test -d dist/data/results && echo 'Prebuilt dist OK'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
