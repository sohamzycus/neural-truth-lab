# Repo-root fallback when Netlify has NO base directory set.
# Prefer: set Base directory to session2/web and leave UI build fields empty.

[build]
  command = "bash session2/web/scripts/netlify-build.sh"
  publish = "session2/web/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
