name: Deploy Attention Evolution to Netlify (session8)

# Uses NETLIFY_AUTH_TOKEN (shared with session2/3/4). Prebuilt dist pattern.

on:
  push:
    branches: [main]
    paths:
      - 'session8/web/**'
      - '.github/workflows/netlify-deploy-session8.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session8/web
    steps:
      - uses: actions/checkout@v4

      - name: Verify prebuilt dist
        run: |
          test -f dist/index.html
          test -n "$(ls dist/assets/*.js 2>/dev/null)"

      - name: Deploy to Netlify
        run: |
          cd dist
          zip -r ../deploy.zip .
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
               -H "Content-Type: application/zip" \
               --data-binary @../deploy.zip \
               "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_NAME/deploys"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_NAME: attention-evolution-erav5
