name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  session1:
    name: Neural Truth Lab (session1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: session1/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  session2-web:
    name: SamaBPE web (session2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: session2/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:netlify
