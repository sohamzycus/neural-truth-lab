name: SamaBPE CI

on:
  push:
    paths: ['session2/**']
  pull_request:
    paths: ['session2/**']

defaults:
  run:
    working-directory: session2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && source .venv/bin/activate && pip install -r requirements.txt
      - run: source .venv/bin/activate && python scripts/fetch_corpora.py
      - run: source .venv/bin/activate && python scripts/verify.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd web && npm ci && npm test && npm run build
