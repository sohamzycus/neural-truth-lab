# SamaBPE static Vite app — Netlify site: sama-bpe-tokenizer-413.netlify.app
# Account: niyogi.soham@gmail.com (Soham's Buddies team)
# Set Netlify UI base directory to session2/web (NOT repo root).

[build]
  command = "test -f dist/index.html && test -d dist/data/results && echo 'Prebuilt dist OK'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
