# SamaBPE static Vite app (used when Netlify UI base directory = session2/web only).
# Prefer repo-root netlify.toml with build.base = "session2/web" and empty UI base directory.

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
