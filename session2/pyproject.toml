[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samabpe"
version = "1.0.0"
description = "SamaBPE — The Fair Tokenizer Lab"
requires-python = ">=3.11"
dependencies = [
  "regex>=2024.0.0",
  "requests>=2.31.0",
  "tokenizers>=0.20.0",
  "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
