# India-First 40B — prebuilt dist (session2 pattern)
# Netlify UI: Base directory = session3/web, link to GitHub repo.
# Build runs on Netlify servers — no local CLI upload (avoids Zscaler).

[build]
  command = "test -f dist/index.html && test -f dist/data/matrices.json && test -d dist/diagrams && echo 'Prebuilt dist OK'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
