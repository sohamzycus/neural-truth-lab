# India-First 40B — Netlify (GitHub-connected build on Netlify servers)
# UI: set Base directory to session3/web in Netlify dashboard.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
